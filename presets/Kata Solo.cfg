# s between rounds that still counts as in a row Min: 0.00 Max: 20.00 Default: 2.00
RealLimbs.pistolWindow=2.0

# s a zombie a blast leaves on its feet staggers dazed, on drunk steps (0: none) Min: 0.00 Max: 12.00 Default: 1.20
RealLimbs.blastStun=1.2

# a pipe bomb's blast (explosion power 90) on a zombie beside it, less further off (0: as a melee tap) Min: 0.00 Max: 35.00 Default: 3.50
