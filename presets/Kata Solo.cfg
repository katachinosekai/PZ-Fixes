# Car grabs: the chance a zombie your car strikes (and does not kill) catches hold of its side and is dragged along; it lets go after Car grab time, or sooner when shaken off (a hard turn, the brakes). 0: never Min: 0.00 Max: 1.00 Default: 0.10
RealLimbs.carGrabChance=0.1

# s at most a zombie holds on to a car (Car grabs) Min: 0.00 Max: 25.00 Default: 2.50
RealLimbs.carGrabTime=2.5

# Headshots only: a zombie dies only from a hit to the head (melee to the head, a headshot, a stomp or swing at the head on the floor, a finisher); any other blow still hits it with physics (it staggers, falls or flies as always) but leaves it alive on a sliver of health. Off: any blow that takes its health kills it, as in the base game
RealLimbs.headshotKills=false

# Fights back: a zombie that caught itself after a hit comes at you again quickly when you are within reach, so a fight stays a struggle. Off: it walks the stagger off first
RealLimbs.fightsBack=false

# m: how near you are for Fights back Min: 0.00 Max: 16.00 Default: 1.60
RealLimbs.fightsBackReach=1.6

# s after its last hit a zombie with you within reach ends its stagger, with Fights back (else backToFight) Min: 0.00 Max: 10.00 Default: 0.60
