# Only with the Immersive Snow - Viewpoint add-on (its 3D snow on the ground): from 10 cm of snow (Snow depth) wading through it tires you; no speed limits. Not on squares cleared with a shovel; on trampled paths it is easier. In MP the server decides.
ImmersiveSnow.SnowSlowdown=true

# Game hours of rain that wash a full cover of snow off the ground, in stages: the snow thins out, the prints and the depth go with it; heavy rain is twice as fast. 0: all at once at the next hour, as in vanilla. In MP the server decides. Min: 0.00 Max: 48.00 Default: 3.00
ImmersiveSnow.RainWashHours=3.0

# Only in the 3D view of Viewpoint with the Immersive Snow - Viewpoint add-on: the snow on vehicles stands out as a layer where it settles on top (the roof, the bonnet: up to about 12 cm at the last stage at 100%); clothes, the vehicles' sides, ice and frost on the glass stay flat. 0: flat, as before. Min: 0 Max: 200 Default: 100
ImmersiveSnow.SnowThickness3D=100

# Only in the 3D view of Viewpoint with the Immersive Snow - Viewpoint add-on: the snow on the ground has a depth (prints, ruts and furrows pressed into it). Off: the ground snow is flat, as Viewpoint lays it.
ImmersiveSnow.Snow3DGround=true

# Only in the 3D view of Viewpoint with the Immersive Snow - Viewpoint add-on: the snow on vehicles lies on top as a layer with a thickness (roof, bonnet, boot). Off: the snow on vehicles is flat, as in the isometric view.
ImmersiveSnow.Snow3DVehicles=true

# Draws the bars, latches, gate locks and spiked boards on doors, windows and gates. Off: they work exactly the same, but nothing is drawn (use it if you see visual glitches or run a mod that changes those sprites). Experimental.
TrancasRemoviveis.WorldArt=true

# Minimum Carpentry level to build the nailed, screwed and metal door bars. The simple latch needs no skill. Spiked boards and stair hatches have their own levels. Min: 0 Max: 10 Default: 2
TrancasRemoviveis.CarpentryLevel=2

# Minimum Welding level to fit the metal reinforcement on a door bar. Spiked boards and iron hatches use their own welding requirement. Min: 0 Max: 10 Default: 4
TrancasRemoviveis.WeldingLevel=4

# Reference time, in seconds, to lock or unlock a bar. Each type takes a share of it: latch 15 percent, nailed or screwed bar 40 percent, metal bar 60 percent. Raise it to make locking slower and riskier during an attack. Min: 1 Max: 30 Default: 2
TrancasRemoviveis.OperateSeconds=2

# Reference time, in seconds, for building and fixing. Each item takes a share of it: door bars 10 percent to 33 percent, spiked boards 50 percent to 150 percent (more boards and metal take longer), stair hatches 100 percent to 150 percent. Re-nailing and repairs are shorter. Min: 5 Max: 600 Default: 30
TrancasRemoviveis.BuildSeconds=30

# Allows the metal reinforcement on door bars: the strongest bar (8000 HP), which needs Welding. Off: new metal bars cannot be built or upgraded. It does not affect spiked boards or hatches.
TrancasRemoviveis.MetalEnabled=true

# Allows building spiked barricades (single doors, windows, walls, wooden fences and wooden double gates). Off: their build options disappear from the menus.
TrancasRemoviveis.SpikesEnabled=true

# Carpentry level to build a single spiked board. The metal-reinforced version needs one level more, plus Welding. Min: 0 Max: 10 Default: 6
TrancasRemoviveis.SpikeCarpentry=6

# Carpentry level to build the X (two crossed spiked boards). The metal-reinforced version needs one level more, plus Welding. Min: 0 Max: 10 Default: 7
TrancasRemoviveis.SpikeCarpentryX=7

# One board. The X (two boards) has twice as much. A vanilla barricade plank has 1000 HP. Min: 500 Max: 20000 Default: 2500
TrancasRemoviveis.SpikeHealth=2500

# One board. The X (two boards) has twice as much. Min: 500 Max: 20000 Default: 4000
TrancasRemoviveis.SpikeMetalHealth=4000

# Damage a zombie takes each time it hits the board with fresh nails. 15 = 0.15 health; a normal zombie has roughly 1.5 to 2. The X deals the same damage as a single board. Min: 0 Max: 1000 Default: 15
TrancasRemoviveis.SpikeDamage=15

# Damage fades linearly to zero over this many hits, then the board must be re-nailed. The X lasts twice as long. Min: 1 Max: 100000 Default: 300
TrancasRemoviveis.SpikeHits=300

# Off: spiked boards can only be fixed on a side that is outdoors.
TrancasRemoviveis.SpikesInside=true

# Off: on a door between a building and the street, bars and latches can only be built and operated from indoors. On: players can bar a door from the street and lock others in.
TrancasRemoviveis.BarsOutside=true

# Displays learned point-of-interest markers on the world map (M). Untick to hide all N3WO Map Overhaul markers.
N3WOMapOverhaul.ShowDiscoveredPOIs=true

# Shows a floating notification above your character the moment a new point of interest is learned.
N3WOMapOverhaul.DiscoveryNotifications=true

# How much health a fall takes from you, times the game's own. 0: falls never hurt. 0.5: half. 2: twice as deadly. Injuries such as broken legs still happen as usual. Min: 0.00 Max: 10.00 Default: 1.00
RealLimbs.PlayerFallDamage=1.0

# How much health a fall takes from a zombie that falls in its physics body (off a roof, down the stairs, out of a window), on top of the game's zombie fall damage. 0: they never get hurt falling. Min: 0.00 Max: 10.00 Default: 1.00
RealLimbs.ZombieFallDamage=1.0

# Off: nobody in this world gets physics bodies; zombies and people react as in the base game. A switch for the whole server, whatever each player's own settings say.
RealLimbs.Bodies=true

# On: the changes made after Update 23 stay off in this world or on this server (cars passing through bodies, the shove of a fended-off bite, Sentient Zeds climbs, the Viewpoint nightly hand-back, quicker sprinter get-ups). Bug fixes stay on. For a server where a newer change misbehaves.
RealLimbs.SafeMode=false

# Off: A-Life and Bandits NPCs react as their mod and the game make them, without a physics body. Zombies keep theirs.
RealLimbs.HumanBodies=true

# How the dead lie once their body has settled. Either way the corpse lies where the body fell, so you loot it where you see it. Default = Each player's own setting
    -- 1 = Each player's own setting
    -- 2 = As the body fell (ragdoll)
    -- 3 = The game's own corpse pose
RealLimbs.CorpsePose=3

# The longest a dead body may go on moving in its physics before it becomes a lootable corpse, in seconds. Lower: corpses appear sooner, and a body still moving freezes as it is. Min: 2 Max: 60 Default: 20
RealLimbs.CorpseWait=2

# The most zombies one player's hits can have in a physics body at once (falling, staggering, ragdolling). A zombie two players fight together is one body, counted once. Over the limit, new hits get the base game's reactions until one of that player's bodies settles. The server limit below can lower it for a while when very many players fight at once. Min: 1 Max: 64 Default: 12
RealLimbs.MaxBodiesPerPlayer=12

# The most zombies in a physics body at once on the whole server, all players together. While the players together stay under it, each keeps their own limit (bodies per player). When they reach it, it is shared out equally among the players using bodies: with 1000 here and 10 per player, 90 players fighting at once get 10 each, 200 players get 5 each. When the fighting calms down, everyone gets their full limit back. Bodies already moving are never cut off. 0: no server limit. Min: 0 Max: 100000 Default: 1000
RealLimbs.MaxBodies=1000

# Players further than this from the player whose hit made a body see that zombie as the game shows it. Corpses reach every player wherever they are. Min: 10 Max: 200 Default: 70
RealLimbs.ShareRange=70

# How often each player sends its bodies to the others. Higher: smoother and closer to where the body really is for them, more network traffic. 20 keeps up with high ping. Min: 2 Max: 20 Default: 20
RealLimbs.SendRate=20

# A corpse is moved to where its body lies only within this distance of where the server made it. A safeguard against a wrong or cheating client. Min: 1 Max: 50 Default: 12
RealLimbs.MaxCorpseMove=12

# Real Limbs messages the server takes from one player each second; the rest are dropped. A safeguard against a broken or cheating client flooding the server. Min: 10 Max: 200 Default: 40
RealLimbs.CommandLimit=40

# On: every player plays with the server's own Real Limbs settings while on it, and gets their own back when they leave. Export your settings from the Real Limbs settings window and put the file on the server as Zomboid/Lua/RealLimbs/server-settings.txt.
RealLimbs.ServerSettings=false

# Off: every player plays with the same Real Limbs settings while on this server: the defaults, or the server's own file (below). The player whose hit makes a body runs it for everyone, so their settings decide how long zombies stay down or whether falls cripple them for all. Each player's performance settings always stay their own. On: each player's own settings make the bodies of their hits.
RealLimbs.PlayerSettings=false

# On: every setting on the Real Limbs tabs that you change from its default is used by every player in this world or on this server, over their own settings and over the server's file. A setting left at its default stays each player's own (or the server's). Off: the settings on those tabs do nothing. Safe mode also turns them off. Performance settings always stay each player's own. The settings window has these and every other setting.
RealLimbs.SandboxSettings=false

# How much it takes to put a zombie on the floor, with melee and shoves (rounds stay as tuned). 0 Default: as the mod is tuned; a hard blow, a critical hit or a lucky shove can drop it. 1 Robust: about twice the blows or shoves of Default; a blow to the body, the head or the arms mostly staggers it, a critical hit drops it about half the time; hits to the legs wear them down (2 or 3 bat hits to one leg) and they heal slowly; the fourth shove within 4 seconds drops it, a lucky shove sometimes. 2 Hard: no single blow to the body and no single shove drops it; it goes down when its legs give (2 to 4 hits to one leg), at the fourth shove within 4 seconds, or to a big blow (a sledgehammer, a blast); a critical hit or a shove drops it at once only on weak legs Min: 0 Max: 2 Default: 0
RealLimbs.zombieToughness=0

# Every hit: how far it shoves and throws them (lower: heavier zombies that take more to move) Min: 0.00 Max: 10.00 Default: 1.00
RealLimbs.kickScale=1.0

# All muscle torque limits: how hard a muscle can pull at most (lower: heavier, slower recoveries) Min: 0.00 Max: 10.00 Default: 1.00
RealLimbs.torqueScale=1.0

# Every muscle: how strongly a body holds its pose (lower: floppier; higher: stiffer) Min: 0.00 Max: 10.00 Default: 1.00
RealLimbs.muscleScale=1.0

# How firmly every body follows the pose it is after (the walk, the steps, the reflexes), in the world Min: 0.00 Max: 10.00 Default: 1.00
RealLimbs.pinScale=1.0

# How much a head wound bleeds: drops while the body falls and a pool under the head. Times the game's own blood setting (0: none). Min: 0.00 Max: 10.00 Default: 1.00
RealLimbs.blood=1.0

# The share of strong headshot kills whose legs give at once (realistic); the rest ripple: the head snaps back, the upper body follows, the legs go last Min: 0.00 Max: 1.00 Default: 0.25
RealLimbs.headshotDrop=0.25

# The share of kills that go limp on the spot instead of stumbling first (0 to 1). Min: 0.00 Max: 1.00 Default: 0.35
RealLimbs.dropDeadChance=0.35

# How hard a dead body's last twitches are (1: as designed, 0: none). Min: 0.00 Max: 10.00 Default: 0.75
RealLimbs.throes=0.75

# The share of deaths with no twitches at all (relaxed and still is the rule) Min: 0.00 Max: 1.00 Default: 0.70
RealLimbs.throesNone=0.7

# Seconds at most from a kill to the corpse you can loot: its last moves and twitches fade out so it lies still in time (0: it settles for as long as it moves) Min: 0.00 Max: 18.00 Default: 1.80
RealLimbs.lootWait=1.8

# Single player: a zombie going down dead shows its pockets in the loot window at once, the same container its corpse gets (its random loot comes with the corpse)
RealLimbs.lootAsTheyFall=true

# Stumbling, how much it still reaches for the player (less the harder it is thrown; 0: the clip's arms) Min: 0.00 Max: 10.00 Default: 0.60
RealLimbs.intentStagger=0.6

# Melee hits: Every hit (the default): each blow with a weapon or a fist (yours, or an NPC's) uses physics; it staggers, stumbles, falls. Killing blow only: your blows play like the base game while the zombie is alive, and only the blow that kills it uses physics, so it drops with a real body. This is on purpose
RealLimbs.ownMelee=true

# Shove (Space): Every hit (the default): a zombie you shove stumbles back with physics. Killing blow only: a shove never kills, so this is simply the base game's shove
RealLimbs.ownShove=true

# Stomp: Every hit (the default): a zombie on the floor you stomp (a crawler) takes it with physics. Killing blow only: your stomps play like the base game, and only the stomp that kills it uses physics. This is on purpose. A body already lying with physics still feels every stomp
RealLimbs.ownStomp=true

# Handgun rounds: Every hit (the default): each round uses physics. Killing blow only: your rounds play like the base game while the zombie is alive, and only the round that kills it uses physics, so it drops with a real body. This is on purpose
RealLimbs.ownPistol=true

# Rifle rounds: Every hit (the default): each round, an automatic rifle's too, uses physics. Killing blow only: your rounds play like the base game while the zombie is alive, and only the round that kills it uses physics, so it drops with a real body. This is on purpose
RealLimbs.ownRifle=true

# Shotgun blasts: Every hit (the default): each blast uses physics, and one that kills throws the body. Killing blow only: your blasts play like the base game while the zombie is alive, and only the blast that kills it uses physics, so it drops with a real body. This is on purpose
RealLimbs.ownShotgun=true

# Explosions: Every hit (the default): the zombies around a bomb that goes off (a pipe bomb, a fire bomb) are thrown or dazed with physics. Killing blow only: the ones it does not kill react as in the base game, and only the ones it kills use physics, so they drop with a real body. This is on purpose
RealLimbs.ownBlasts=true

# Cars: Every hit (the default): a zombie you run down is struck with physics (the shins, the hips, onto the hood). Killing blow only: it reacts as in the base game, and only a car that kills it uses physics, so it drops with a real body. This is on purpose
RealLimbs.ownCars=true

# Falls: a zombie falling off a roof, out of a window or down a hole falls and lands with physics. Off: the game's own reaction there, no physics
RealLimbs.ownFalls=true

# Tripping over bodies: a zombie walking over a body in its way may trip on it and fall with physics (how often: Trip on bodies). Off: the game's own reaction there, no physics (they walk through bodies)
RealLimbs.ownTrips=true

# Knocked into: a stumbling or falling body knocks the zombies it runs into, and they stumble or fall with physics. Off: the game's own reaction there, no physics (they stand their ground)
RealLimbs.ownBumps=true

# Climbing, hit: a zombie hit on a fence or in a window takes the hit there with physics and falls off whichever side. Off: the game's own reaction there, no physics
RealLimbs.ownClimbHits=true

# Climbing, killed: a zombie killed on a fence or in a window dies there with physics and falls off. Off: the game's own reaction there, no physics
RealLimbs.ownClimbKills=true

# Climbing, landing: a zombie that lands from a climb over a fence or through a window lies there with physics and gets up with it. Off: the game's own reaction there, no physics
RealLimbs.ownClimbEnd=true

# Crawlers, hit: a crawler hit and not killed takes it with physics from where it crawls, then crawls on. Off: the game's own reaction there, no physics
RealLimbs.ownCrawlerHits=true

# Crawlers, killed: a crawler killed dies with physics from where it crawls. Off: the game's own reaction there, no physics
RealLimbs.ownCrawlerKills=true

# Eating a body: a zombie hit while it eats falls with physics and gets up with it. Off: the game's own reaction there, no physics
RealLimbs.ownEaterHits=true

# Burnt to death: a zombie burnt to death on its feet goes down with physics, the legs first. Off: the game's own reaction there, no physics
RealLimbs.ownFireDeaths=true

# Other deaths: a zombie or a person dead on its feet of anything but your attacks (an NPC's blow, a bite, bleeding, another mod) goes down with physics. Off: the game's own reaction there, no physics
RealLimbs.ownOtherDeaths=true

# Human NPCs (A-Life, Bandits): people react with physics when hit, knocked down or killed (the next three switches choose which). Off: the game's and their mod's own reactions, no physics for people at all
RealLimbs.ownNpcs=true

# NPCs, hit: a living NPC hit takes the blow with physics, on top of its own flinch. Off: the game's and its mod's own reaction there, no physics
RealLimbs.ownLivingHumans=true

# NPCs, knocked down: a living NPC knocked down falls with physics; then it gets up and fights on. Off: the game's and its mod's own reaction there, no physics
RealLimbs.ownHumanFalls=true

# NPCs, killed: an NPC killed dies a person's death with physics: a hand on the wound, stumbling, the knees going. Off: the game's and its mod's own reaction there, no physics
RealLimbs.ownHumans=true

# Pushes from other mods: a zombie another mod knocks down or makes flinch (a door slammed into it by Push Doors, an NPC mod's fighter) is pushed with physics the way that mod says. Off: the game's and that mod's own reaction there, no physics
RealLimbs.ownForeignHits=true

# Blocked fences: a zombie at low fences or sandbags with something solid right behind them (a compost box, furniture) bangs on them and breaks them, as it does with a door. Off: it stands there trying to climb for good, as in the base game
RealLimbs.fenceThump=true

