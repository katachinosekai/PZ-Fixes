# Gun mods that deal their own damage (Shoot to Thrill): their rounds push the body with physics like the game's own. Off: their shots are left to that mod
RealLimbs.modShots=true

# Shoot to Thrill: on a server its rounds push the body too (your game takes each hit it claims from the server as your own hit, one push a round), and its rounds push the part they hit, head, chest, an arm or a leg. Off: on a server its rounds push nothing, and in single player they push the chest or the head
RealLimbs.sttRounds=true

# Shoot to Thrill: its leg falls and crippled legs wait while a zombie is in its physics body, so a leg shot drops it with physics and it crawls once the body hands it back. Off: its leg fall takes the zombie at once, even mid-fall
RealLimbs.modShotsLegs=true

# Escape From Zomboid Firearms with its own ballistics on: its rounds push the body on the part they hit, one push a round (one through an arm into the chest too), and with a server that flies them the shooter's game takes each as its own hit, as with the game's guns (false: its rounds push as the game's own hits, the part from the game's hit reaction, and a server's rounds play the game's own reaction)
RealLimbs.efzRounds=true

# Drop Kick: the drop kick of the Drop Kick [SP] mod throws a zombie back off its feet with physics, as hard as the Viewpoint Parkour drop kick and by your strength. Off: the light bare-hands push any punch gets
RealLimbs.dropKickHits=true

# Drop Kick: how hard the Drop Kick [SP] mod's drop kick throws a zombie, times the tuned push (3 times the Real Limbs kick, thrown up and back; 0.5: half, 2: twice) Min: 0.00 Max: 10.00 Default: 1.00
RealLimbs.dropKickPush=1.0

# Addons built on Real Limbs: their own hits (a punch, a blade, a shot, a blast) push a zombie with physics, and they may make a zombie's body heavier, lighter, stronger or weaker (a brute, a tank) (false: those hits and body changes do nothing, every body as tuned; their kicks, events and reads work as usual)
RealLimbs.addonBodies=true

