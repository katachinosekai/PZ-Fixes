RealLimbs.floorTargets=true

# Knockdowns only: a living zombie gets physics only when the game itself knocks it down (the shove or blow it falls from); hits it stays up through react as in the base game, and the killing blow always uses physics. Off: every hit uses physics, as the attack switches say
