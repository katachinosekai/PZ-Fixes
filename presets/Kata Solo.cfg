ALife.Support_MaxCalls=2

# Limits buildings selected for starting residents across the whole map. Selection happens once per world; stations, firehouses and clinics take priority.
# Default 75. Min: 1 Max: 200 Default: 75
ALife.Population_PopulateMax=75

# Sets the minimum time between new distant travelling groups. Existing groups stay; the world group limit and local quiet periods still apply.
# Default 3. Min: 0.25 Max: 48.00 Default: 3.00
ALife.Offline_FoundGapHours=3.0

# Sets the finite survivor pool when the world starts. Natural groups and reinforcements draw from it; deaths reduce it. Slow arrivals replace losses. Admin spawns do not count.
# Default 360. Min: 20 Max: 5000 Default: 360
ALife.Census_Size=360

# How many welcome groups each new character gets, and how many can be alive in one town at once, even when several players start there.
# Default 8. Min: 1 Max: 8 Default: 8
ALife.TownWelcome_GroupsPerTown=8

# Blocks new travelling groups when this many already live within 240 tiles. From day 4, the limit drops by one but never below one.
# Default 4. Min: 1 Max: 8 Default: 4
ALife.Population_NeighbourGroups=4

# Maximum outposts with a coordinated group away at once. Set 0 to stop departures.
# Default 2. Min: 0 Max: 8 Default: 2
ALife.Outposts_TrioMaxActive=2

# Maximum large marching groups away at once, with one per faction. Set 0 to stop departures.
# Default 1. Min: 0 Max: 8 Default: 1
ALife.Outposts_MegaMaxActive=1

# NPC driving, passenger crews and automatic multiplayer control handover. Driving debug controls require admin access.
ALifeDriving.Enabled=true

# By car spawns create functioning vehicles with seated NPC crews. They drive to a reachable nearby road and dismount. Requires loaded terrain.
ALifeDriving.VehicleArrivals=true

# Single player only. While you pick a reply the game runs slowly, then eases back when you choose or close.
# Default on.
ALife.Talk_SlowTimeWhileChoosing=true

# How fast the game runs while you choose a reply: 1 is normal speed, 0.2 is one fifth, 0.05 is almost frozen. Only used when slowing time is on.
# Default 0.2. Min: 0.05 Max: 1.00 Default: 0.20
ALife.Talk_SlowTimeFactor=0.2

# Replies and the window fade in and out, the chosen reply flashes. Off when Animated text is off.
# Default on.
ALife.Talk_FadeAnimations=true

# Replies that have a consequence show in yellow at the top, asked questions drop out of the list, and skill or reputation replies show a small tag.
# Default on.
ALife.Talk_CyberStyle=true

# With someone to talk to in sight, F opens the conversation instead of the flashlight; otherwise F stays the flashlight. The talk key always works. Off: talk key only.
# Default on.
ALife.Talk_KeyF=true

# Which conversation window players get. New is the side panel; Old cinematic is the earlier window with numbered answers. A player's Journal setting still wins unless you pick a forced value.
# Default New. Default = New
    -- 1 = New
    -- 2 = Old cinematic
    -- 3 = New (forced)
    -- 4 = Old cinematic (forced)
ALife.Talk_WindowStyle=1

# Shows the skill and reputation replies you do not qualify for yet, greyed out with their requirement.
# Default off.
ALife.Talk_ShowLockedLines=false

# Only one question is open at a time, questions from different people keep a gap, and low-value ones are rationed. Danger and robbery questions always get through.
# Default on.
ALife.Talk_AskGovernor=true

# Real seconds before a lesser question from another person or crew may reach you after the last one. Needs the question limit on.
# Default 60. Min: 0 Max: 600 Default: 60
ALife.Talk_AskGapSeconds=60

# Real seconds before the same person or crew may ask you something new after their last question. Needs the question limit on.
# Default 180. Min: 0 Max: 1800 Default: 180
ALife.Talk_AskSameNpcGapSeconds=180

# At most this many trade offers and small-talk questions reach you per real hour; 0 blocks them. Needs the question limit on.
# Default 4. Min: 0 Max: 60 Default: 4
ALife.Talk_LowValueAsksPerHour=4

# Top speed of NPC cars on roads (arrivals, drive here, patrol). Drive-by and chase speeds are not affected. Corners and obstacles still slow the car.
# Default 60. Min: 20 Max: 90 Default: 60
ALife.Car_CruiseKmh=60

# Multiplies the push the driver gives the car when it speeds up. Higher reaches cruise speed sooner.
# Default 150. Min: 100 Max: 300 Default: 150
ALife.Car_AccelBoost=150

# Writes one line per driven NPC car every few seconds to Lua/alife_cars_dump.txt and flags stalls and other problems as [ALIFE-CARS] ANOMALY lines in console.txt. Costs nothing while no car drives.
# Default on.
ALife.Car_DumpLog=true

# How often each driven NPC car writes a dump line. State changes are written at once.
# Default 2. Min: 1 Max: 30 Default: 2
ALife.Car_DumpLogIntervalS=2

# Colours of the A-Life windows. Cyber: graphite panels, cyan for the selected item, amber for what matters. Classic cyan: the old all-cyan look. Amber: amber instead of cyan.
# Default Cyber. Default = Cyber (cyan + amber)
    -- 1 = Cyber (cyan + amber)
    -- 2 = Classic cyan
    -- 3 = Amber
ALife.UI_Theme=1

# NPCs on foot in the path of a moving car sidestep out of it and run when it is about to hit. Parked, receding and passing cars are ignored.
# Default on.
ALife.Move_EvadeVehicles=true

# NPCs go from calm to suspicious to alert to fighting, and hold each level for a while before calming down.
# Default on.
ALife.Perception_Alertness=true

# How long an NPC stays at full alert after the last sign of a fight.
# Default 12. Min: 1 Max: 120 Default: 12
ALife.Perception_CombatHoldSeconds=12

# How long an NPC stays alert after it spotted a threat and lost sight of it.
# Default 20. Min: 1 Max: 180 Default: 20
ALife.Perception_AlertHoldSeconds=20

# How long an NPC stays suspicious after a noise or a glimpse.
# Default 15. Min: 1 Max: 120 Default: 15
ALife.Perception_SuspicionSeconds=15

# How far an NPC's shout about a threat reaches crewmates. 0 turns callouts off.
# Default 25. Min: 0 Max: 80 Default: 25
ALife.Perception_CalloutTiles=25

# How long a crewmate takes to react to a shout.
# Default 900. Min: 0 Max: 5000 Default: 900
ALife.Perception_CalloutDelayMs=900

# Size of the hold-Q companion order wheel as a share of its normal size, so it covers less of the player. 70 to 130.
# Default 100. Min: 70 Max: 130 Default: 100
ALife.Wheel_Scale=100

# Fades and scales the order wheel in and out for about a tenth of a second. Players who chose static text in the A-Life options always get an instant wheel.
# Default on.
ALife.Wheel_Animated=true

# Robbing or ordering people about needs Strength, more for harder groups. A reply you cannot pass shows greyed with its requirement.
# Default on.
ALife.Talk_ChecksEnabled=true

# Scales the Strength needed against each group. 100 is the standard table (military 10, civilians about 4), 50 halves it. The cap stays 10.
# Default 100. Min: 25 Max: 300 Default: 100
ALife.Talk_CheckStrictness=100

# Master switch for the ambient world sounds: phones, alarms, TV and radio noise, police chatter, distant gunfire and screams, bells and sirens, ocean and forest, the numbers station. Off silences all of them.
# Default on.
ALife.MetaSound_Enabled=true

# House phones, the phones of the dead, and alarm beeps. A dead body's phone also stops drawing zombies when this is off.
# Default on.
ALife.MetaSound_Phones=true

# Emergency broadcast tones, radio backup calls and the radio cutting out.
# Default on.
ALife.MetaSound_TvRadio=true

# Dispatch chatter from police cars near you.
# Default on.
ALife.MetaSound_PoliceRadio=true

# Far-off shootouts, artillery, explosions, screams and cries for help.
# Default on.
ALife.MetaSound_Gunfire=true

# Church bells, police and service sirens, air raid sirens.
# Default on.
ALife.MetaSound_BellsSirens=true

# Ocean waves near open water and wind in the forest.
# Default on.
ALife.MetaSound_Nature=true

# The numbers station and its gong on radios and TVs.
# Default on.
ALife.MetaSound_Numbers=true

# Scales every ambient meta sound above. 0 silences them.
# Default 100. Min: 0 Max: 100 Default: 100
ALife.MetaSound_Volume=100

# Ambient NPC cars (travelers, start traffic, cars that become real when you near them) never appear closer than this to a player. Raid, pull-up, drive-by and police cars may come closer but never inside your view, and walls do not hide them.
# Default 70. Min: 30 Max: 200 Default: 70
ALife.Cars_SpawnDistanceTiles=70

# NPC cars never spawn or appear this close to a player base edge, and arriving crews stop and get out before it. 0 keeps them out of the base itself only.
# Default 40. Min: 0 Max: 150 Default: 40
ALife.Cars_BaseKeepOutTiles=40

# <RGB:1,1,1>The chance for each box type to drop
# from a zombie you kill.
# 
# Every type you turn on is checked on
# its own, and most zombies are
# checked twice. With all 9 types on,
# that is 18 checks per body.
# 
# <RGB:0.100,0.800,1.000>So 0.5 does not mean 0.5% of
# zombies. Many small chances add up.
# At 0.5 you get a box from about 1
# body in 12.
# 
# <RGB:1.000,0.700,0.200>A gun pack's Ammo Loot Drop can be
# on at the same time. This mod owns
# the vanilla boxes then and the pack
# mod drops only its own, so nothing
# lands twice. Real Firearms is the
# one that cannot be on with this.
# 
# <RGB:0.800,1.000,0.000>One box holds 20 to 50 rounds, so a
# small number here is already a lot
# of ammo.
# 
# <RGB:1,1,1>Set it to 0 to stop the drop. Min: 0.00 Max: 100.00 Default: 0.50
AmmoLootDropBox.DropRate=0.5

# <RGB:1,1,1>OFF: any zombie can drop boxes. This
# is the normal setting.
# 
# ON: only zombies who look like they
# carried a gun drop boxes, and only
# the kind that fits their gun:
# 
# <RGB:0.100,0.800,1.000>All types - soldiers, militia (4)
# Pistol, shotgun, rifle - hunters,
# rangers, campers, rednecks,
# survivalists, raiders (20)
# Pistol, shotgun - police, guards,
# bandits, bikers (10)
# Shotgun, rifle - farmers, fishermen
# (2)
# Pistol only - detectives, agents,
# truckers, mobsters (5)
# 
# <RGB:1,1,1>That is 41 of the 125 zombie outfits
# in the game. Every other zombie
# drops nothing. In a normal town,
# only about 1 zombie in 100 wears one
# of these outfits.
# 
# <RGB:0.800,1.000,0.000>So search where these people worked:
# police stations, army bases,
# prisons, farms and bars.
# 
# <RGB:1,1,1>A higher drop rate helps a little,
# but you will still find very little
# in the suburbs.
AmmoLootDropBox.ArmedZombiesOnly=false

AmmoLootDropBox.Ammo3030Box=true

AmmoLootDropBox.AmmoBullets357Box=true

AmmoLootDropBox.Ammo308Box=true

AmmoLootDropBox.AmmoBullets38Box=true

AmmoLootDropBox.AmmoBullets44Box=true

AmmoLootDropBox.AmmoBullets45Box=true

AmmoLootDropBox.AmmoBullets9mmBox=true

AmmoLootDropBox.AmmoShotgunShellsBox=true

AmmoLootDropBox.Ammo556Box=true

